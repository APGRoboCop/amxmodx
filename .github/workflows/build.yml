name: Build

on: ["push", "workflow_dispatch"]

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_short: linux
            compiler_cc: gcc
            compiler_cxx: g++
          - os: ubuntu-latest
            os_short: linux
            compiler_cc: clang
            compiler_cxx: clang++        
          - os: ubuntu-22.04
            os_short: linux
            compiler_cc: clang
            compiler_cxx: clang++
          - os: ubuntu-22.04
            os_short: linux
            compiler_cc: gcc
            compiler_cxx: g++
            compiler_install: 'g++ g++-multilib'
          - os: windows-latest
            os_short: windows
            compiler_cc: msvc
          - os: windows-2016
            os_short: windows
            compiler_cc: msvc++14.16-vs2017-cl
# MacOS 32 Bins seem not supported
#           - os: macos-latest
#             os_short: mac
#             compiler_cc: clang
#             compiler_cxx: clang++            
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os_short }}-${{ matrix.os }}-${{ matrix.compiler_cc }}
    env:
      DEPENDENCIES_FOLDER: dependencies      
      DEPENDENCIES_ROOT: ${{ github.workspace }}/dependencies      
      DEPENDENCIES_ROOT_WIN: ${{ github.workspace }}\dependencies              
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
          path: amxmodx
      # Setup Python for AMBuild
      - uses: actions/setup-python@v2
        name: Setup Python 3.12
        with:
          python-version: 3.12
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 --version
      - name: Install AMXModX dependencies (Linux)
        if: startsWith(runner.os, 'Linux')
        shell: bash
        run: |
          mkdir -p ${{ env.DEPENDENCIES_ROOT }}
          cd ${{ env.DEPENDENCIES_ROOT }}
          
          git clone https://github.com/alliedmodders/ambuild
          git clone https://github.com/Bots-United/metamod-hl1 metamod
          git clone https://github.com/Bots-United/hlsdk
          
          cd ambuild
          python3 setup.py install     
      - name: Install AMXModX dependencies (Windows)
        if: startsWith(runner.os, 'Windows')
        shell: cmd
        run: |
          mkdir %DEPENDENCIES_ROOT_WIN%\nasm
          curl -L -o "%DEPENDENCIES_ROOT_WIN%\nasm\nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/2.13.03/win32/nasm-2.13.03-win32.zip
          chdir %DEPENDENCIES_ROOT_WIN%\nasm
          7z x nasm.zip
          
          chdir %DEPENDENCIES_ROOT_WIN%
          git clone https://github.com/alliedmodders/ambuild
          git clone https://github.com/Bots-United/metamod-hl1 metamod
          git clone https://github.com/Bots-United/hlsdk
          
          curl -L -o "mysql-connector-c-6.1.1-win32.zip" https://downloads.mysql.com/archives/get/p/19/file/mysql-connector-c-6.1.1-win32.zip
          7z x mysql-connector-c-6.1.1-win32.zip -o"mysql"
          cd mysql
          dir
          ren mysql-connector-c-6.1.1-win32 mysql-5.7
          move /Y mysql-5.7 ..\
          
          cd ..\ambuild
          python3 setup.py install          
      - name: Install Linux dependencies
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib libstdc++6 lib32stdc++6 \
            libc6-dev libc6-dev-i386 linux-libc-dev \
            linux-libc-dev:i386 lib32z1-dev nasm \
            ${{ matrix.compiler_cc }} ${{ matrix.compiler_install }}
      - name: Install MySQL 5.7 Connector (Linux)
        if: startsWith(runner.os, 'Linux')
        run: |
          # The URL for the 32-bit (i686) generic Linux connector compatible with MySQL 5.7
          MYSQL_URL="https://downloads.mysql.com/archives/get/p/23/file/mysql-connector-c-6.1.11-linux-glibc2.12-i686.tar.gz"
          
          # Download the archive
          curl -L -o "mysql-connector.tar.gz" $MYSQL_URL
          
          # Create the destination folder
          mkdir -p ${{ env.DEPENDENCIES_ROOT }}/mysql-5.7
          
          # Extract the contents directly into the folder
          tar -xzf mysql-connector.tar.gz --strip-components=1 -C ${{ env.DEPENDENCIES_ROOT }}/mysql-5.7
      - name: Select compiler
        if: startsWith(runner.os, 'Linux')
        run: |
          echo "CC=${{ matrix.compiler_cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler_cxx }}" >> $GITHUB_ENV
          ${{ matrix.compiler_cc }} --version
          ${{ matrix.compiler_cxx }} --version
      - uses: ilammy/setup-nasm@v1
      - name: Build Linux
        if: startsWith(runner.os, 'Linux')
        working-directory: amxmodx
        run: |
          mkdir build
          cd build
          python3 ../configure.py --enable-optimize --metamod=${{ env.DEPENDENCIES_ROOT }}/metamod --hlsdk=${{ env.DEPENDENCIES_ROOT }}/hlsdk --mysql=${{ env.DEPENDENCIES_ROOT }}/mysql-5.7
          ambuild
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build Windows
        if: startsWith(runner.os, 'Windows')
        working-directory: amxmodx
        shell: cmd
        run: |
          cl.exe
          mkdir build
          cd build
          python3 ../configure.py --enable-optimize --metamod=${{ env.DEPENDENCIES_ROOT_WIN }}\metamod --hlsdk=${{ env.DEPENDENCIES_ROOT_WIN }}\hlsdk --mysql=${{ env.DEPENDENCIES_ROOT_WIN }}\mysql-5.7
          ambuild
          
